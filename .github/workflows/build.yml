name: Build Fabric Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Restrictions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Verify JAR
        shell: bash
        run: |
          echo "Files produced in build/libs:"
          ls -lah build/libs
          test -f build/libs/minecraft-restrictions-1.1.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-restrictions-fabric-1.1.0
          path: build/libs/minecraft-restrictions-1.1.0.jar
          if-no-files-found: error
