name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "microsoft"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"

      - name: Build Fabric mod
        run: gradle build --no-daemon

      - name: Show built files
        run: ls -lah build/libs/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-restrictions-fabric-1.0.0
          path: build/libs/minecraft-restrictions-1.0.0.jar
          if-no-files-found: error
