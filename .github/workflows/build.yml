name: Build Ghost Partner Fabric Mod

on:
  push:
    branches:
      - ghost-partner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 26.3 Fabric JAR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "25"
          cache: gradle
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Compile and package
        run: gradle --no-daemon clean build
      - name: Verify JAR exists
        run: test -f build/libs/ghost-partner-0.1.0.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-partner-fabric-26.3-0.1.0
          path: build/libs/ghost-partner-0.1.0.jar
          if-no-files-found: error
